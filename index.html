<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple To-Do App</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            padding: 10px;
            width: 70%;
        }
        button {
            padding: 10px;
            cursor: pointer;
        }
        li {
            list-style: none;
            margin: 10px 0;
            text-align: left;
        }
        li span {
            cursor: pointer;
            color: red;
            float: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>My To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
</div>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");
    li.textContent = task;

    let removeBtn = document.createElement("span");
    removeBtn.textContent = "X";
    removeBtn.onclick = function() {
        li.remove();
    };

    li.appendChild(removeBtn);
    document.getElementById("taskList").appendChild(li);

    input.value = "";
}
</script>

</body>
</html>
